[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomalygov-ml"
version = "0.1.0"
description = "Worker de ETL e detecção de anomalias do AnomalyGov"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "psycopg[binary]",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
# Figures of the article (anomalygov_ml.figures); the worker does not need them.
figures = ["matplotlib"]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
